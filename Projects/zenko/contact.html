<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact – ZENKO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Barlow:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="logo" href="index.html">ZENKO</a>
    <nav aria-label="Main">
      <a href="index.html">Home</a>
      <a href="flavours.html">Flavours</a>
      <a href="why.html">Why Zenko</a>
      <a href="contact.html" aria-current="page">Contact</a>
      <a class="btn" href="cart.html" id="cartBtn">Cart (<span id="count">0</span>)</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="pagehead">
    <h1>Contact</h1>
    <p>Questions about Zenko? Send us a message and we will get back to you.</p>
  </div>
  <section class="section cartbox">
    <form id="contactForm" novalidate>
      <label>Your name<input id="cname" autocomplete="name"></label>
      <label>Email<input id="cemail" type="email" autocomplete="email"></label>
      <label>Message<textarea id="cmsg" rows="5"></textarea></label>
      <div class="err" id="cerr" role="alert"></div>
      <button class="btn" type="submit" id="sendBtn">Send message</button>
    </form>
    <div class="done" id="cdone" hidden>Thank you! Your message has been sent.</div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 Zenko Energy Drink. Sample page for a class project.</span>
    <nav aria-label="Footer">
      <a href="index.html">Home</a><a href="flavours.html">Flavours</a><a href="why.html">Why Zenko</a><a href="contact.html">Contact</a><a href="cart.html">Cart</a>
    </nav>
  </div>
</footer>
<script src="script.js"></script>
</body>
</html>
